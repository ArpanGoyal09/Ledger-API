name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create schema
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ledger_app -d ledger -f src/main/resources/db/schema.sql

      - name: Run tests
        env:
          DB_PASSWORD: ci_password
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: mvn -B test